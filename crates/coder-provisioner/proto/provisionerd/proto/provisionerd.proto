syntax = "proto3";

// Stripped vendoring of the upstream `provisionerd/proto/provisionerd.proto`.
// Only the messages and RPCs required by the currently-ported RPCs
// (CommitQuota, AcquireJob) are retained; the rest (UpdateJob, FailJob,
// CompleteJob, UploadFile, DownloadFile) will be added in follow-up
// batches along with the corresponding `provisionersdk/proto` imports
// they require.
//
// The package name and message field numbers must match upstream so the
// on-the-wire encoding remains compatible with Go provisioner daemons.
// The nested `WorkspaceBuild` / `TemplateImport` / `TemplateDryRun`
// payloads are intentionally omitted from `AcquiredJob` in this first
// port slice — the server currently returns an empty envelope or the
// top-level scalar fields (see `TODO-provisionerd-acquirejob-full-payload`
// in `drpc_service.rs`).
package provisionerd;

// Empty indicates a successful request/response.
message Empty {}

message CommitQuotaRequest {
  string job_id = 1;
  int32 daily_cost = 2;
}

message CommitQuotaResponse {
  bool ok = 1;
  int32 credits_consumed = 2;
  int32 budget = 3;
}

// AcquiredJob is returned when a provisioner daemon has a job locked.
//
// This stripped version only exposes the top-level scalar fields upstream
// populates on every acquired job; the upstream `oneof type` payload
// (WorkspaceBuild / TemplateImport / TemplateDryRun) and the
// `template_source_archive` bytes field are omitted until the richer
// acquire path (parameter resolution, file fetch, etc.) is ported. Go
// clients tolerate missing optional fields, so this envelope is wire
// compatible for the "no job available" and "job acquired but payload
// not yet hydrated" cases.
message AcquiredJob {
  string job_id = 1;
  int64 created_at = 2;
  string provisioner = 3;
  string user_name = 4;
  // trace_metadata is currently used for tracing information only. It
  // allows jobs to be tied to the request that created them.
  map<string, string> trace_metadata = 9;
}
