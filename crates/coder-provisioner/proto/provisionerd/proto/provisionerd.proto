syntax = "proto3";

// Stripped vendoring of the upstream `provisionerd/proto/provisionerd.proto`.
// Only the messages and RPCs required by the currently-ported RPCs
// (CommitQuota, AcquireJob, UpdateJob, FailJob) are retained; the rest
// (CompleteJob, UploadFile, DownloadFile, AcquireJobWithCancel) will be
// added in follow-up batches along with the corresponding
// `provisionersdk/proto` imports they require.
//
// The package name and message field numbers must match upstream so the
// on-the-wire encoding remains compatible with Go provisioner daemons.
// The nested `WorkspaceBuild` / `TemplateImport` / `TemplateDryRun`
// payloads are intentionally omitted from `AcquiredJob` in this first
// port slice — the server currently returns an empty envelope or the
// top-level scalar fields (see `TODO-provisionerd-acquirejob-full-payload`
// in `drpc_service.rs`).
package provisionerd;

// Empty indicates a successful request/response.
message Empty {}

message CommitQuotaRequest {
  string job_id = 1;
  int32 daily_cost = 2;
}

message CommitQuotaResponse {
  bool ok = 1;
  int32 credits_consumed = 2;
  int32 budget = 3;
}

// AcquiredJob is returned when a provisioner daemon has a job locked.
//
// This stripped version only exposes the top-level scalar fields upstream
// populates on every acquired job; the upstream `oneof type` payload
// (WorkspaceBuild / TemplateImport / TemplateDryRun) and the
// `template_source_archive` bytes field are omitted until the richer
// acquire path (parameter resolution, file fetch, etc.) is ported. Go
// clients tolerate missing optional fields, so this envelope is wire
// compatible for the "no job available" and "job acquired but payload
// not yet hydrated" cases.
message AcquiredJob {
  string job_id = 1;
  int64 created_at = 2;
  string provisioner = 3;
  string user_name = 4;
  // trace_metadata is currently used for tracing information only. It
  // allows jobs to be tied to the request that created them.
  map<string, string> trace_metadata = 9;
}

// ── UpdateJob ─────────────────────────────────────────────────
//
// Minimal subset of the provisionersdk types required by UpdateJob. The
// full `provisionersdk/proto/provisioner.proto` schema is much larger,
// but UpdateJob's request only touches Log / TemplateVariable /
// VariableValue / LogLevel / LogSource. Keeping the field numbers in
// sync with upstream is load-bearing — Go provisioner daemons encode
// using those numbers and the server must decode compatibly.

// LogLevel mirrors `provisioner.LogLevel`.
enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

// LogSource mirrors the top-level `provisionerd.LogSource` enum.
enum LogSource {
  PROVISIONER_DAEMON = 0;
  PROVISIONER = 1;
}

// Log is the subset of `provisionerd.Log` used by UpdateJob.
message Log {
  LogSource source = 1;
  LogLevel level = 2;
  int64 created_at = 3;
  string stage = 4;
  string output = 5;
}

// TemplateVariable mirrors `provisioner.TemplateVariable`.
message TemplateVariable {
  string name = 1;
  string description = 2;
  string type = 3;
  string default_value = 4;
  bool required = 5;
  bool sensitive = 6;
}

// VariableValue mirrors `provisioner.VariableValue`.
message VariableValue {
  string name = 1;
  string value = 2;
  bool sensitive = 3;
}

// UpdateJobRequest is sent periodically as a heartbeat with job updates.
//
// Field numbers and `reserved 3` match upstream
// `provisionerd/proto/provisionerd.proto::UpdateJobRequest` so Go
// provisioner daemons can talk to this Rust server unchanged.
message UpdateJobRequest {
  reserved 3;

  string job_id = 1;
  repeated Log logs = 2;
  repeated TemplateVariable template_variables = 4;
  repeated VariableValue user_variable_values = 5;
  bytes readme = 6;
  map<string, string> workspace_tags = 7;
}

// UpdateJobResponse returns the job's cancellation state and any
// resolved variable values.
//
// `reserved 2` matches upstream.
message UpdateJobResponse {
  reserved 2;

  bool canceled = 1;
  repeated VariableValue variable_values = 3;
}

// ── FailJob ───────────────────────────────────────────────────
//
// FailedJob is sent when a provisioner daemon reports a job failure.
// The message retains upstream field numbers and the full top-level
// oneof envelope so Go daemons stay wire-compatible. The nested
// `WorkspaceBuild.timings` field (upstream field 2, typed
// `repeated provisioner.Timing`) is not yet vendored — `reserved 2`
// preserves the slot for when the provisionersdk types land in a
// follow-up batch. Server-side handling of `state` and per-type
// cleanup (workspace-build deadline reset, end-of-logs pubsub) is
// also a follow-up; this first slice only persists the top-level
// `error` / `error_code` and marks the job completed via the
// existing `update_provisioner_job_with_complete_by_id` store hook.

message FailedJob {
  message WorkspaceBuild {
    // Reserved for `repeated provisioner.Timing timings = 2;` which
    // requires the provisionersdk types to be vendored.
    reserved 2;

    bytes state = 1;
  }
  message TemplateImport {}
  message TemplateDryRun {}

  string job_id = 1;
  string error = 2;
  oneof type {
    WorkspaceBuild workspace_build = 3;
    TemplateImport template_import = 4;
    TemplateDryRun template_dry_run = 5;
  }
  string error_code = 6;
}
