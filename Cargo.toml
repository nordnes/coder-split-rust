[workspace]
members = [
    "apps/coder-parity",
    "apps/coderd",
    "crates/coder-audit",
    "crates/coder-auth",
    "crates/coder-connectivity",
    "crates/coder-core",
    "crates/coder-db",
    "crates/coder-identity",
    "crates/coder-notifications",
    "crates/coder-provisioner",
    "crates/coder-rbac",
    "crates/coder-server",
    "crates/coder-workspaces",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/coder/coder"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
cron = "0.15"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
pbkdf2 = "0.12"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "rand_core", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["normalize-path", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
