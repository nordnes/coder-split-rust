[workspace]
members = [
    "apps/coder-parity",
    "apps/coderd",
    "crates/coder-audit",
    "crates/coder-auth",
    "crates/coder-connectivity",
    "crates/coder-core",
    "crates/coder-db",
    "crates/coder-integration-tests",
    "crates/coder-identity",
    "crates/coder-license",
    "crates/coder-notifications",
    "crates/coder-provisioner",
    "crates/coder-rbac",
    "crates/coder-mcp",
    "crates/coder-server",
    "crates/coder-telemetry",
    "crates/coder-workspaces",
    "crates/coder-benchmarks",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/coder/coder"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
chrono-tz = "0.10"
cron = "0.15"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "ws"] }
governor = { version = "0.7", default-features = false, features = ["std", "dashmap", "jitter"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.26"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
jsonwebtoken = "9.3"
pbkdf2 = "0.12"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "rand_core", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "normalize-path", "request-id", "trace", "util"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry", "time"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
web-push = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
